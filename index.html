<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Anatomy Workout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d13; color: #f3f4f6; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    circle { transition: stroke-dashoffset 0.15s linear; }
  </style>
</head>
<body class="min-h-screen max-w-md mx-auto flex flex-col bg-slate-950 border-x border-slate-800 shadow-2xl relative select-none">

  <!-- Header -->
  <header class="px-5 py-4 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="font-display font-bold text-lg text-white tracking-tight">KineCore Routine</h1>
      <p class="text-[10px] tracking-widest text-slate-500 uppercase font-semibold">14 Movements • 60s Work / 20s Rest</p>
    </div>
    <button onclick="toggleAudio()" id="audio-btn" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300">
      <i class="fa-solid fa-volume-high" id="audio-icon"></i>
    </button>
  </header>

  <!-- Player Stage -->
  <main class="flex-1 overflow-y-auto px-4 py-4 pb-28 space-y-4">
    <div id="player-card" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 relative transition-all duration-300">
      <div class="flex justify-between items-center text-xs">
        <span id="phase-badge" class="font-bold tracking-wider uppercase text-red-500 font-display">Work Phase</span>
        <span id="counter-badge" class="text-slate-400 font-bold">1 / 14</span>
      </div>

      <!-- Main High-Res Image Display -->
      <div class="w-full aspect-[16/10] bg-white rounded-xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
        <img id="main-img" src="1-dead-bug.png" alt="Exercise View" class="w-full h-full object-contain p-2">
        
        <!-- Rest Overlay -->
        <div id="rest-hud" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm hidden flex-col items-center justify-center p-4 text-center">
          <span class="text-xs uppercase tracking-wider font-bold text-emerald-400 font-display mb-1">Rest & Recovery</span>
          <p class="text-lg font-bold text-white font-display" id="up-next-title">Up Next: Bear Plank Hold</p>
          <p class="text-xs text-slate-400 mt-1" id="up-next-muscles">Target: Core & Quads</p>
        </div>
      </div>

      <div>
        <h2 id="main-title" class="text-xl font-bold font-display text-white">1. Dead Bug</h2>
        <p id="main-muscles" class="text-xs text-slate-400 mt-0.5">Target: Transverse Abdominis, Obliques</p>
      </div>

      <!-- Timer & Progress Ring Controls -->
      <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 mt-1">
        <div>
          <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider block">Time Left</span>
          <span id="timer-text" class="text-4xl font-display font-extrabold text-white">01:00</span>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="prevEx()" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 text-sm">
            <i class="fa-solid fa-backward"></i>
          </button>
          <button onclick="togglePlay()" id="play-btn" class="w-14 h-14 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center text-white text-xl shadow-lg shadow-red-950">
            <i class="fa-solid fa-play ml-0.5" id="play-icon"></i>
          </button>
          <button onclick="nextEx()" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 text-sm">
            <i class="fa-solid fa-forward"></i>
          </button>
        </div>

        <div class="relative w-14 h-14 flex items-center justify-center">
          <svg class="w-full h-full -rotate-90">
            <circle cx="28" cy="28" r="24" stroke="#1e293b" stroke-width="4" fill="none" />
            <circle id="ring-progress" cx="28" cy="28" r="24" stroke="#ef4444" stroke-width="4" stroke-dasharray="150.79" stroke-dashoffset="0" fill="none" />
          </svg>
          <span id="ring-text" class="absolute text-[11px] font-bold font-display text-slate-300">100%</span>
        </div>
      </div>
    </div>

    <!-- 14 Exercise List -->
    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 pt-2 font-display">Daily Exercise Flow</h3>
    <div id="exercise-list" class="space-y-2"></div>
  </main>

  <script>
    const exercises = [
      { id: 1, name: "Dead Bug", file: "1-dead-bug.png", muscles: "Rectus Abdominis, Obliques" },
      { id: 2, name: "Bear Plank Hold", file: "2-bear-plank.png", muscles: "Transverse Abdominis, Quads, Serratus" },
      { id: 3, name: "Glute Bridge March", file: "3-glute-bridge.png", muscles: "Gluteus Maximus, Hamstrings" },
      { id: 4, name: "Bird Dog", file: "4-bird-dog.png", muscles: "Erector Spinae, Glutes, Core" },
      { id: 5, name: "Forearm Plank", file: "5-forearm-plank.png", muscles: "Transverse Abdominis, Core Wall" },
      { id: 6, name: "Bicycle Crunches", file: "6-bicycle-crunches.png", muscles: "Obliques, Rectus Abdominis" },
      { id: 7, name: "Flutter Kicks", file: "7-flutter-kicks.png", muscles: "Lower Abs, Hip Flexors" },
      { id: 8, name: "Heel Taps", file: "8-heel-taps.png", muscles: "Obliques, Abdominal Wall" },
      { id: 9, name: "Hand Release Push-ups", file: "9-pushups.png", muscles: "Pectoralis Major, Triceps, Deltoids" },
      { id: 10, name: "Hollow Hold", file: "10-hollow-hold.png", muscles: "Rectus Abdominis, Quads" },
      { id: 11, name: "High Plank Shoulder Taps", file: "11-shoulder-taps.png", muscles: "Shoulder Stabilizers, Core" },
      { id: 12, name: "Reverse Crunches", file: "12-reverse-crunches.png", muscles: "Lower Abdominals, Hip Flexors" },
      { id: 13, name: "Side Plank Left & Right", file: "13-side-plank.png", muscles: "Lateral Obliques, Stabilizers" },
      { id: 14, name: "Plank Hold", file: "14-plank-hold.png", muscles: "Total Core, Serratus, Quads" }
    ];

    let current = 0;
    let isWork = true;
    let timeLeft = 60;
    let isRunning = false;
    let timer = null;
    let audioOn = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration) {
      if (!audioOn) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleAudio() {
      audioOn = !audioOn;
      document.getElementById('audio-icon').className = audioOn ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-red-400";
    }

    const listEl = document.getElementById("exercise-list");
    exercises.forEach((item, index) => {
      const card = document.createElement("div");
      card.id = `item-${index}`;
      card.className = "flex items-center gap-3 p-2.5 rounded-xl bg-slate-900 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition";
      card.onclick = () => selectExercise(index);
      card.innerHTML = `
        <div class="w-14 aspect-[16/10] bg-white rounded-lg overflow-hidden flex items-center justify-center p-0.5 border border-slate-700 flex-shrink-0">
          <img src="${item.file}" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 60\\'><rect width=\\'100\\' height=\\'60\\' fill=\\'%23f3f4f6\\'/><text x=\\'50\\' y=\\'35\\' text-anchor=\\'middle\\' font-size=\\'10\\' fill=\\'%2394a3b8\\'>3D Image</text></svg>'">
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-xs font-bold text-white truncate font-display">${item.id}. ${item.name}</h4>
          <p class="text-[10px] text-slate-400 truncate mt-0.5">${item.muscles}</p>
        </div>
        <span class="text-[10px] font-bold text-slate-500 font-display">60s</span>
      `;
      listEl.appendChild(card);
    });

    function selectExercise(idx) {
      clearInterval(timer);
      isRunning = false;
      current = idx;
      isWork = true;
      timeLeft = 60;
      updateUI();
    }

    function togglePlay() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (isRunning) {
        clearInterval(timer);
        isRunning = false;
      } else {
        isRunning = true;
        timer = setInterval(tick, 1000);
      }
      updateUI();
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        if (timeLeft <= 3 && timeLeft > 0) beep(580, 0.1);
      } else {
        beep(880, 0.4);
        if (isWork) {
          isWork = false;
          timeLeft = 20;
        } else {
          isWork = true;
          timeLeft = 60;
          current = (current + 1) % exercises.length;
        }
      }
      updateUI();
    }

    function prevEx() {
      current = (current - 1 + exercises.length) % exercises.length;
      selectExercise(current);
    }

    function nextEx() {
      current = (current + 1) % exercises.length;
      selectExercise(current);
    }

    function updateUI() {
      const cur = exercises[current];
      const next = exercises[(current + 1) % exercises.length];

      document.getElementById("main-title").innerText = `${cur.id}. ${cur.name}`;
      document.getElementById("main-muscles").innerText = `Target: ${cur.muscles}`;
      document.getElementById("main-img").src = cur.file;
      document.getElementById("counter-badge").innerText = `${current + 1} / 14`;

      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById("timer-text").innerText = `${m}:${s}`;

      const total = isWork ? 60 : 20;
      const progress = (timeLeft / total) * 100;
      const c = 2 * Math.PI * 24;
      document.getElementById("ring-progress").style.strokeDashoffset = c - (progress / 100) * c;
      document.getElementById("ring-progress").style.stroke = isWork ? "#ef4444" : "#10b981";
      document.getElementById("ring-text").innerText = `${Math.ceil(progress)}%`;

      const hud = document.getElementById("rest-hud");
      const badge = document.getElementById("phase-badge");
      if (isWork) {
        badge.innerText = "Work Phase";
        badge.className = "font-bold tracking-wider uppercase text-red-500 font-display";
        hud.classList.add("hidden");
      } else {
        badge.innerText = "Rest Interval";
        badge.className = "font-bold tracking-wider uppercase text-emerald-400 font-display";
        document.getElementById("up-next-title").innerText = `Up Next: ${next.name}`;
        document.getElementById("up-next-muscles").innerText = `Target: ${next.muscles}`;
        hud.classList.remove("hidden");
      }

      document.getElementById("play-icon").className = isRunning ? "fa-solid fa-pause text-xl" : "fa-solid fa-play ml-0.5 text-xl";
      document.getElementById("play-btn").className = isRunning
        ? "w-14 h-14 rounded-full bg-amber-600 hover:bg-amber-500 flex items-center justify-center text-white text-xl shadow-lg shadow-amber-950"
        : "w-14 h-14 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center text-white text-xl shadow-lg shadow-red-950";

      exercises.forEach((_, i) => {
        const item = document.getElementById(`item-${i}`);
        item.className = (i === current)
          ? "flex items-center gap-3 p-2.5 rounded-xl bg-red-950/30 border border-red-700/80 transition"
          : "flex items-center gap-3 p-2.5 rounded-xl bg-slate-900 border border-slate-800/80 transition";
      });
    }

    selectExercise(0);
  </script>
</body>
</html>
